site_name: Awesome Hackathon
site_description: Complete hackathon handbook, resource catalog, blueprints, playbooks, organizer operations, and repository documentation
site_author: Awesome Hackathon contributors
site_url: https://sihab-hasan.github.io/awesome-hackathon/
repo_url: https://github.com/sihab-hasan/awesome-hackathon
repo_name: sihab-hasan/awesome-hackathon
docs_dir: .site-docs
site_dir: site
copyright: >
  Copyright © 2026 Awesome Hackathon Contributors.
  Documentation licensed under MIT.
  External resources retain their respective licenses.

theme:
  name: material
  palette:
    # Follow the operating-system preference by default
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode

    # Explicit light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    # Explicit dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  variant: modern
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav: []
