site_name: Awesome Hackathon
site_description: End-state hackathon handbook, blueprint library, and curated resource catalog
site_author: Awesome Hackathon contributors
site_url: https://sihab-hasan.github.io/awesome-hackathon/
repo_url: https://github.com/sihab-hasan/awesome-hackathon
repo_name: sihab-hasan/awesome-hackathon
edit_uri: edit/main/handbook/
docs_dir: handbook
copyright: Content licensed under MIT; external resources retain their own terms.

theme:
  name: material
  palette:
    # Follow the operating-system preference by default
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode

    # Explicit light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    # Explicit dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: lucide/moon
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

