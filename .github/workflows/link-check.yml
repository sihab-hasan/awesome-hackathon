name: Link check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths: ["**/*.md", "catalog/resources.json", "lychee.toml"]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@7da8ec1fc4e01b5a12062ac6c589c10a4ce70d67
        with:
          args: --config lychee.toml --no-progress "**/*.md" "catalog/resources.json"
          fail: true
