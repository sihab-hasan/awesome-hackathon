name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --requirement requirements-validation.txt
      - run: python3 -m compileall -q scripts tests
      - run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - run: python3 scripts/validate_structured_files.py
      - run: python3 scripts/generate_catalog.py --check
      - run: python3 scripts/check_placeholders.py
      - run: python3 scripts/review_due.py --strict
      - run: python3 scripts/validate_repository.py
      - run: python3 -m unittest discover -s tests -v
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --requirement requirements-docs.txt
      - run: python3 scripts/prepare_docs_site.py
      - run: zensical build --strict --config-file mkdocs-site.generated.yml
