name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check whether code scanning is enabled
        id: code_scanning
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output /tmp/code-scanning.json --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1")"

          if [[ "${status}" == "200" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${status}" == "404" || "${status}" == "403" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Code scanning is not enabled or available for this repository. Enable it in Settings > Security > Code security, then rerun CodeQL."
          else
            cat /tmp/code-scanning.json
            echo "::error::Unable to determine code-scanning availability (HTTP ${status})."
            exit 1
          fi

      - name: Initialize CodeQL
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Analyze with CodeQL
        if: steps.code_scanning.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@v4

      - name: CodeQL skipped
        if: steps.code_scanning.outputs.enabled != 'true'
        run: echo "CodeQL upload skipped because GitHub code scanning is not enabled for this repository."
